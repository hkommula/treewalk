<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>UOW Campus Tree Walk</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        :root {
            /* UOW Brand Colors */
            --uow-red: #E51937;
            --uow-navy: #001A3B;
            --bg-dark: #0d1117;
            --panel-bg: rgba(13, 17, 23, 0.92);
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --accent-green: #238636;
        }
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg-dark); }
        
        #map { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; background: var(--bg-dark); }

        /* Floating UI Panel */
        #ui-panel {
            position: absolute; top: 20px; left: 20px; width: 360px; height: calc(100vh - 40px);
            background: var(--panel-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.08); border-radius: 16px;
            z-index: 1000; display: flex; flex-direction: column;
            box-shadow: 0 12px 40px rgba(0,0,0,0.6); transition: all 0.3s ease;
        }
        .panel-header { padding: 24px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .panel-body { padding: 16px; overflow-y: auto; flex-grow: 1; scroll-behavior: smooth; }
        
        /* UOW Branding Tweaks */
        .uow-title { color: var(--text-main); font-weight: 800; letter-spacing: -0.5px; }
        .uow-title span { color: var(--uow-red); }

        /* Routing Controls */
        .route-controls { display: flex; gap: 8px; margin-top: 16px; }
        .route-btn { flex: 1; font-size: 0.8rem; font-weight: 600; padding: 8px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.4); color: var(--text-muted); cursor: pointer; transition: all 0.2s; }
        .route-btn:hover { background: rgba(255,255,255,0.05); color: var(--text-main); }
        .route-btn.active { background: var(--uow-red); border-color: var(--uow-red); color: #fff; box-shadow: 0 4px 12px rgba(229, 25, 55, 0.3); }
        .route-stats { font-size: 0.85rem; color: #fff; margin-top: 12px; font-weight: 600; display: flex; justify-content: space-between; padding: 10px; background: rgba(255,255,255,0.03); border-radius: 8px; }

        /* Tree Cards */
        .tree-card {
            background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255,255,255,0.04);
            border-radius: 12px; padding: 16px; margin-bottom: 12px; cursor: pointer;
            transition: all 0.2s ease;
        }
        .tree-card:hover { background: rgba(255, 255, 255, 0.06); transform: translateY(-1px); }
        .tree-card.active { border-color: var(--uow-red); background: rgba(229, 25, 55, 0.08); border-left: 4px solid var(--uow-red); }
        .tree-card.visited { opacity: 0.5; border-color: var(--accent-green); background: rgba(35, 134, 54, 0.05); border-left: 1px solid var(--accent-green); }
        
        /* Map Controls */
        .map-controls { position: absolute; top: 20px; right: 20px; z-index: 1000; display: flex; flex-direction: column; gap: 12px; }
        .icon-btn { background: var(--panel-bg); color: var(--text-main); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; width: 44px; height: 44px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; backdrop-filter: blur(16px); box-shadow: 0 6px 16px rgba(0,0,0,0.4); transition: all 0.2s; }
        .icon-btn:hover { background: rgba(255,255,255,0.1); }
        .icon-btn.active { background: var(--uow-red); border-color: var(--uow-red); color: #fff; }

        /* Leaflet Popup Overhaul */
        .leaflet-popup-content-wrapper { padding: 0; background: var(--panel-bg); color: var(--text-main); border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.8); backdrop-filter: blur(12px); }
        .leaflet-popup-content { margin: 0; width: 260px !important; }
        .leaflet-popup-tip { background: var(--panel-bg); border: 1px solid rgba(255,255,255,0.1); }
        .leaflet-container a.leaflet-popup-close-button { color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,0.8); padding: 8px; z-index: 10; }
        
        .popup-img-wrapper { position: relative; width: 100%; height: 150px; overflow: hidden; cursor: zoom-in; }
        .popup-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s ease; }
        .popup-img-wrapper:hover .popup-img { transform: scale(1.05); }
        
        .popup-body { padding: 16px; }
        .uow-text-red { color: var(--uow-red); font-weight: 700; margin-bottom: 2px; }
        .popup-coords { background: rgba(0,0,0,0.3); padding: 6px; border-radius: 6px; font-family: monospace; font-size: 0.75rem; text-align: center; margin-bottom: 12px; }

        /* Fullscreen Lightbox */
        #lightbox { display: none; position: fixed; z-index: 9999; top:0; left:0; width:100vw; height:100vh; background: rgba(0,0,0,0.92); justify-content:center; align-items:center; opacity: 0; transition: opacity 0.3s; backdrop-filter: blur(10px); }
        #lightbox.show { display: flex; opacity: 1; }
        #lightbox img { max-width: 90%; max-height: 90%; border-radius: 12px; box-shadow: 0 0 40px rgba(0,0,0,0.8); }
        .close-lightbox { position: absolute; top: 24px; right: 24px; font-size: 2.5rem; color: rgba(255,255,255,0.7); cursor: pointer; transition: color 0.2s; }
        .close-lightbox:hover { color: #fff; }

        /* Mobile Layout Split */
        @media (max-width: 768px) {
            #ui-panel { top: auto; bottom: 0; left: 0; width: 100vw; height: 48vh; border-radius: 24px 24px 0 0; border: none; border-top: 1px solid rgba(255,255,255,0.08); }
            .panel-header { padding: 20px 24px; }
            .map-controls { top: 15px; right: 15px; }
            #map { height: 55vh; }
            #ui-panel::before { content: ''; width: 40px; height: 4px; background: rgba(255,255,255,0.15); border-radius: 2px; position: absolute; top: 10px; left: 50%; transform: translateX(-50%); }
            .leaflet-popup-content { width: 240px !important; }
        }
    </style>
</head>
<body>

<div id="map"></div>

<div id="ui-panel">
    <div class="panel-header">
        <h4 class="uow-title mb-1">UOW <span>Tree Walk</span></h4>
        <div class="route-stats" id="route-stats">
            <span><i class="bi bi-signpost-fill text-muted"></i> -- km</span>
            <span><i class="bi bi-clock-history text-muted"></i> -- mins</span>
        </div>
        <div class="route-controls">
            <button class="route-btn active" onclick="setRouteMode('recommended')" id="btn-recommended">Recommended</button>
            <button class="route-btn" onclick="setRouteMode('auto')" id="btn-auto">Nearest</button>
            <button class="route-btn" onclick="setRouteMode('random')" id="btn-random">Random</button>
        </div>
    </div>
    <div class="panel-body" id="stops-list">
        <div class="text-center text-muted mt-5"><div class="spinner-border spinner-border-sm mb-2"></div><br>Loading Data...</div>
    </div>
</div>

<div class="map-controls">
    <button id="gps-toggle" class="icon-btn" title="Track my location"><i class="bi bi-crosshair"></i></button>
    <button id="btn-paths" class="icon-btn active" title="Toggle Background Paths"><i class="bi bi-layers"></i></button>
</div>

<div id="lightbox" onclick="closeLightbox()">
    <i class="bi bi-x close-lightbox"></i>
    <img id="lightbox-img" src="" alt="Fullscreen Tree">
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<script>
    // ==========================================
    // 1. MAP INIT
    // ==========================================
    const expandedBounds = [[-34.4285, 150.8468], [-34.3795, 150.9081]];
    const map = L.map('map', { maxBounds: expandedBounds, maxBoundsViscosity: 1.0, minZoom: 14, zoomControl: false }).setView([-34.4058, 150.8800], 16);
    
    // Add Zoom Control to Bottom Right to avoid UI overlaps
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { attribution: '© CARTO', maxZoom: 20 }).addTo(map);

    let treeData = [], currentRoute = [], markersMap = {};         
    let routeGroupFull = L.layerGroup().addTo(map);
    let routeGroupRemaining = L.layerGroup().addTo(map);
    let visitedStops = new Set();
    let userLoc = null;          

    let networkGraph = {}, nodeCoordinates = {};

    function getDistance(lat1, lon1, lat2, lon2) {
        const R = 6371e3; const p1 = lat1 * Math.PI/180; const p2 = lat2 * Math.PI/180;
        const dp = (lat2-lat1) * Math.PI/180; const dl = (lon2-lon1) * Math.PI/180;
        const a = Math.sin(dp/2) * Math.sin(dp/2) + Math.cos(p1) * Math.cos(p2) * Math.sin(dl/2) * Math.sin(dl/2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    // ==========================================
    // 2. PARSE GEOJSON (Heavily De-emphasized)
    // ==========================================
    let pathsLayer = null;
    fetch('campus_paths.geojson').then(r => r.json()).then(data => {
        data.features.forEach(feature => {
            if (feature.geometry && feature.geometry.type === 'LineString') {
                const coords = feature.geometry.coordinates; 
                for (let i = 0; i < coords.length - 1; i++) {
                    const p1 = coords[i], p2 = coords[i+1];
                    const k1 = `${p1[1].toFixed(5)},${p1[0].toFixed(5)}`, k2 = `${p2[1].toFixed(5)},${p2[0].toFixed(5)}`;
                    nodeCoordinates[k1] = [p1[1], p1[0]]; nodeCoordinates[k2] = [p2[1], p2[0]];
                    const dist = getDistance(p1[1], p1[0], p2[1], p2[0]);
                    if (!networkGraph[k1]) networkGraph[k1] = []; if (!networkGraph[k2]) networkGraph[k2] = [];
                    networkGraph[k1].push({ to: k2, dist: dist }); networkGraph[k2].push({ to: k1, dist: dist });
                }
            }
        });

        // Barely visible background pathways
        pathsLayer = L.geoJSON(data, {
            style: (feat) => ['footway', 'path', 'pedestrian', 'steps'].includes(feat.properties.highway) 
                ? { color: "#ffffff", weight: 1.5, opacity: 0.1 } 
                : { color: "#ffffff", weight: 1, opacity: 0.05, dashArray: "3, 4" }
        }).addTo(map);
        loadTreeCSV();
    }).catch(err => { console.warn("No local path network found."); loadTreeCSV(); });

    function snapToNetwork(lat, lng) {
        let minD = Infinity; let bestKey = null;
        for (let key in nodeCoordinates) {
            const [nLat, nLng] = nodeCoordinates[key];
            const d = getDistance(lat, lng, nLat, nLng);
            if (d < minD) { minD = d; bestKey = key; }
        }
        return bestKey;
    }

    function findNetworkPath(startKey, endKey) {
        if (!networkGraph[startKey] || !networkGraph[endKey]) return null;
        let distances = {}, previous = {}, queue = new Set();
        for (let key in networkGraph) { distances[key] = Infinity; queue.add(key); }
        distances[startKey] = 0;
        
        while (queue.size > 0) {
            let shortestKey = null; let minD = Infinity;
            queue.forEach(key => { if (distances[key] < minD) { minD = distances[key]; shortestKey = key; } });
            if (shortestKey === null || shortestKey === endKey) break;
            queue.delete(shortestKey);
            
            networkGraph[shortestKey].forEach(edge => {
                let alt = distances[shortestKey] + edge.dist;
                if (alt < distances[edge.to]) { distances[edge.to] = alt; previous[edge.to] = shortestKey; }
            });
        }
        if (distances[endKey] === Infinity) return null;
        let path = []; let curr = endKey;
        while (curr) { path.push(nodeCoordinates[curr]); curr = previous[curr]; }
        return path.reverse();
    }

    // ==========================================
    // 3. LOAD CSV & BUILD MODERN POPUPS
    // ==========================================
    function loadTreeCSV() {
        Papa.parse('trees.csv', {
            download: true, header: true, skipEmptyLines: true,
            complete: function(results) {
                treeData = results.data.filter(r => r['Latitude'] && r['Longitude']).map((row, i) => ({
                    id: i + 1,
                    lat: parseFloat(row['Latitude']), lng: parseFloat(row['Longitude']),
                    name: row['Common Name'] || "Unknown Tree",
                    scientific: row['Scientific Name'] || "Unknown Species",
                    family: row['Family'] || "Unknown Family",
                    img: row['Photo Filename'] ? `photos/${row['Photo Filename']}` : "https://via.placeholder.com/400x300/222/555?text=No+Photo"
                }));
                buildMapMarkers(); setRouteMode('recommended'); 
            }
        });
    }

    function buildMapMarkers() {
        treeData.forEach(tree => {
            const iconHTML = `<div id="icon-${tree.id}" style="background-color: var(--uow-red); width: 14px; height: 14px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 8px rgba(0,0,0,0.8);"></div>`;
            const customIcon = L.divIcon({ html: iconHTML, className: '', iconSize: [14, 14], iconAnchor: [7, 7] });
            const marker = L.marker([tree.lat, tree.lng], { icon: customIcon }).addTo(map);
            
            const alaLink = `https://bie.ala.org.au/search?q=${encodeURIComponent(tree.scientific)}`;

            const popupContent = `
                <div class="custom-popup-content">
                    <div class="popup-img-wrapper">
                        <img class="popup-img" src="${tree.img}" onclick="openLightbox('${tree.img}')" alt="${tree.name}">
                    </div>
                    <div class="popup-body">
                        <h5 class="uow-text-red">${tree.name}</h5>
                        <p class="fst-italic text-muted mb-2" style="font-size: 0.85rem;">${tree.scientific}</p>
                        <p class="mb-3" style="font-size: 0.8rem;"><strong>Family:</strong> ${tree.family}</p>
                        
                        <div class="popup-coords text-muted">
                            LAT: ${tree.lat.toFixed(5)} &bull; LNG: ${tree.lng.toFixed(5)}
                        </div>

                        <div class="d-flex flex-column gap-2 mt-2">
                            <a href="${alaLink}" target="_blank" class="btn btn-outline-light btn-sm text-decoration-none" style="border-color: rgba(255,255,255,0.2);">
                                <i class="bi bi-box-arrow-up-right"></i> Learn More at ALA
                            </a>
                            <button class="btn btn-sm btn-success w-100" id="btn-visit-${tree.id}">
                                <i class="bi bi-check2-circle"></i> Mark as Visited
                            </button>
                        </div>
                    </div>
                </div>
            `;
            
            // Dynamic Auto-Pan configuration to prevent overlap with UI panel
            const isMobile = window.innerWidth <= 768;
            marker.bindPopup(popupContent, {
                autoPanPaddingTopLeft: isMobile ? L.point(10, 10) : L.point(400, 20),
                autoPanPaddingBottomRight: isMobile ? L.point(10, window.innerHeight * 0.5) : L.point(20, 20)
            });
            
            markersMap[tree.id] = marker;
            marker.on('click', () => { activateTree(tree.id); });
            marker.on('popupopen', () => { setupVisitButton(tree.id); });
        });
    }

    // ==========================================
    // 4. ROUTE COMPILATION (Network vs Dotted Snaps)
    // ==========================================
    function setRouteMode(mode) {
        document.querySelectorAll('.route-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(`btn-${mode}`).classList.add('active');

        if (mode === 'recommended') currentRoute = [...treeData];
        else if (mode === 'random') currentRoute = [...treeData].sort(() => Math.random() - 0.5);
        else if (mode === 'auto') {
            if (!userLoc) { alert("Enable GPS location tracking first."); setRouteMode('recommended'); return; }
            let unvisited = [...treeData], currentPoint = userLoc;
            currentRoute = [];
            while(unvisited.length > 0) {
                let nearestIdx = 0, minD = Infinity;
                unvisited.forEach((pt, idx) => {
                    let d = getDistance(currentPoint.lat, currentPoint.lng, pt.lat, pt.lng);
                    if (d < minD) { minD = d; nearestIdx = idx; }
                });
                let nextPt = unvisited.splice(nearestIdx, 1)[0];
                currentRoute.push(nextPt);
                currentPoint = nextPt;
            }
        }
        renderSidebar(); generateSmartRoutes();
    }

    function addSegment(start, end, isNetwork, isActive) {
        if (!start || !end) return 0;
        
        let styleFull = isNetwork 
            ? { color: '#E51937', weight: 4, opacity: 0.15 } 
            : { color: '#ffffff', weight: 2, opacity: 0.3, dashArray: '3, 6' }; // Faint dotted for off-path
            
        let styleActive = isNetwork 
            ? { color: '#E51937', weight: 5, opacity: 0.9, lineCap: 'round' } 
            : { color: '#E51937', weight: 2, opacity: 0.8, dashArray: '4, 6' }; // Active dotted for off-path

        // Draw Base Guide Layer
        L.polyline([start, end], styleFull).addTo(routeGroupFull);
        
        // Draw Bright Active Layer if applicable
        if (isActive) {
            L.polyline([start, end], styleActive).addTo(routeGroupRemaining);
        }

        // Return distance for stat calculations
        if(isNetwork && Array.isArray(start[0])) {
            let dist = 0;
            for(let i=0; i<start.length-1; i++) dist += getDistance(start[i][0], start[i][1], start[i+1][0], start[i+1][1]);
            return dist;
        } else {
            return getDistance(start[0], start[1], end[0], end[1]);
        }
    }

    function generateSmartRoutes() {
        routeGroupFull.clearLayers();
        routeGroupRemaining.clearLayers();
        let activeDistMeters = 0;

        let nextTargetIndex = 0;
        if (userLoc) {
            nextTargetIndex = currentRoute.findIndex(t => !visitedStops.has(t.id));
            if (nextTargetIndex === -1) nextTargetIndex = currentRoute.length; 
        }

        for (let i = 0; i < currentRoute.length; i++) {
            let startLat = currentRoute[i].lat, startLng = currentRoute[i].lng;
            
            // Connect User to First Active Stop
            if (i === nextTargetIndex && userLoc) {
                let sKey = snapToNetwork(userLoc.lat, userLoc.lng);
                let eKey = snapToNetwork(startLat, startLng);
                
                if (sKey && eKey) {
                    activeDistMeters += addSegment([userLoc.lat, userLoc.lng], nodeCoordinates[sKey], false, true); // Dotted to network
                    let netPath = findNetworkPath(sKey, eKey);
                    if(netPath) activeDistMeters += addSegment(netPath, netPath, true, true); // Network path
                    activeDistMeters += addSegment(nodeCoordinates[eKey], [startLat, startLng], false, true); // Dotted from network
                } else {
                    activeDistMeters += addSegment([userLoc.lat, userLoc.lng], [startLat, startLng], false, true); // Fallback
                }
            }

            // Connect Tree i to Tree i+1
            if (i < currentRoute.length - 1) {
                let endLat = currentRoute[i+1].lat, endLng = currentRoute[i+1].lng;
                let sKey = snapToNetwork(startLat, startLng);
                let eKey = snapToNetwork(endLat, endLng);
                let isActive = i >= nextTargetIndex;

                if (sKey && eKey) {
                    let d1 = addSegment([startLat, startLng], nodeCoordinates[sKey], false, isActive);
                    let netPath = findNetworkPath(sKey, eKey);
                    let d2 = netPath ? addSegment(netPath, netPath, true, isActive) : 0;
                    let d3 = addSegment(nodeCoordinates[eKey], [endLat, endLng], false, isActive);
                    if(isActive) activeDistMeters += (d1+d2+d3);
                } else {
                    let dFallback = addSegment([startLat, startLng], [endLat, endLng], false, isActive);
                    if(isActive) activeDistMeters += dFallback;
                }
            }
        }

        // Update Stats (Assuming 4.5km/h walking pacing)
        if(activeDistMeters === 0 && currentRoute.length > 0 && !userLoc && nextTargetIndex === 0) {
            // Edge case: Initial state before GPS, estimate full route simply
            document.getElementById('route-stats').innerHTML = `<span><i class="bi bi-signpost-fill"></i> View Map</span><span><i class="bi bi-clock"></i> Est. Route</span>`;
        } else {
            let remDistKm = (activeDistMeters / 1000).toFixed(2);
            let timeMins = Math.ceil((activeDistMeters / 1000) * 13.5);
            document.getElementById('route-stats').innerHTML = `
                <span><i class="bi bi-signpost-fill text-danger"></i> ${remDistKm} km left</span>
                <span><i class="bi bi-clock-history text-danger"></i> ${timeMins} mins</span>
            `;
        }
    }

    // ==========================================
    // 5. SIDEBAR & EVENT SYSTEM
    // ==========================================
    const stopsList = document.getElementById('stops-list');

    function renderSidebar() {
        stopsList.innerHTML = '';
        currentRoute.forEach((tree, index) => {
            const isVis = visitedStops.has(tree.id);
            const card = document.createElement('div');
            card.className = `tree-card ${isVis ? 'visited' : ''}`;
            card.id = `card-${tree.id}`;
            card.innerHTML = `
                <div class="d-flex justify-content-between align-items-start">
                    <div>
                        <div class="small text-muted mb-1" style="font-size:0.7rem; text-transform:uppercase; letter-spacing:0.5px;">Stop ${index + 1}</div>
                        <h6 class="fw-bold mb-0 text-white">${tree.name}</h6>
                        <div class="small text-muted fst-italic" style="font-size:0.8rem;">${tree.scientific}</div>
                    </div>
                    <i class="bi bi-check-circle-fill fs-5 ${isVis ? '' : 'd-none'}" style="color: var(--accent-green);" id="check-${tree.id}"></i>
                </div>
            `;
            card.onclick = () => { activateTree(tree.id); map.flyTo([tree.lat, tree.lng], 18); };
            stopsList.appendChild(card);
        });
    }

    function activateTree(id) {
        document.querySelectorAll('.tree-card').forEach(c => c.classList.remove('active'));
        const card = document.getElementById(`card-${id}`);
        if(card) { card.classList.add('active'); card.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
        markersMap[id].openPopup();
    }

    function setupVisitButton(id) {
        const toggleBtn = document.getElementById(`btn-visit-${id}`);
        if (visitedStops.has(id)) {
            toggleBtn.innerHTML = "<i class='bi bi-arrow-counterclockwise'></i> Mark Unvisited";
            toggleBtn.classList.replace('btn-success', 'btn-outline-secondary');
        }
        toggleBtn.onclick = () => {
            if (visitedStops.has(id)) {
                visitedStops.delete(id);
                document.getElementById(`icon-${id}`).style.backgroundColor = 'var(--uow-red)';
            } else {
                visitedStops.add(id);
                document.getElementById(`icon-${id}`).style.backgroundColor = 'var(--accent-green)';
            }
            map.closePopup(); renderSidebar(); generateSmartRoutes(); 
        };
    }

    // ==========================================
    // 6. LIGHTBOX MODULE
    // ==========================================
    function openLightbox(src) { document.getElementById('lightbox-img').src = src; document.getElementById('lightbox').classList.add('show'); }
    function closeLightbox() { document.getElementById('lightbox').classList.remove('show'); }

    // ==========================================
    // 7. LIVE TRACKING GEOLOCATION
    // ==========================================
    let userMarker = null, watchId = null, isTracking = false;
    const gpsBtn = document.getElementById('gps-toggle');

    gpsBtn.addEventListener('click', function() {
        if (!isTracking) {
            if (!navigator.geolocation) return alert("Geolocation tracking is blocked or unsupported.");
            isTracking = true; this.classList.add('active');
            watchId = navigator.geolocation.watchPosition((pos) => {
                userLoc = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                if (!userMarker) {
                    userMarker = L.circleMarker([userLoc.lat, userLoc.lng], { radius: 7, color: '#fff', weight: 2, fillColor: '#0d6efd', fillOpacity: 1 }).addTo(map);
                    map.flyTo([userLoc.lat, userLoc.lng], 17);
                } else { userMarker.setLatLng([userLoc.lat, userLoc.lng]); }
                generateSmartRoutes();
            }, null, { enableHighAccuracy: true });
        } else {
            isTracking = false; this.classList.remove('active'); userLoc = null;
            navigator.geolocation.clearWatch(watchId);
            if (userMarker) { map.removeLayer(userMarker); userMarker = null; }
            generateSmartRoutes();
        }
    });

    document.getElementById('btn-paths').addEventListener('click', function() {
        if(!pathsLayer) return;
        if(map.hasLayer(pathsLayer)) { map.removeLayer(pathsLayer); this.classList.remove('active'); } 
        else { map.addLayer(pathsLayer); this.classList.add('active'); }
    });
</script>
</body>
</html>
